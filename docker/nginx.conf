server {
  listen 80;
  root /usr/share/nginx/html;

  # api container shares the task's network namespace on Fargate
  location /api/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri /index.html;
  }
}
